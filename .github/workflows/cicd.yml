name: CI/CD

on:
  push:
  pull_request:

# Top-level: read-only by default. Each job elevates only what it needs.
permissions:
  contents: read

jobs:
  # ---------- CI: tests + code/deps scans. No registry keys. ----------
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasks_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Apply DB schema
        run: psql "$DATABASE_URL" -f schema.sql
        env:
          DATABASE_URL: postgresql://test:testpassword@localhost:5432/tasks_test
      - name: Run tests
        run: pnpm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: testpassword
          PGDATABASE: tasks_test
          JWT_SECRET: test-secret

  # ---------- BUILD + PUSH: build once, push by digest. Only from main. ----------
  build:
    needs: ci                                # GATE: only if ci passed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # push to GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}   # expose the immutable digest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ---------- SCAN: clean job, pulls the published image BY DIGEST and scans it ----------
  scan:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read                         # only READ to pull the image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image scan (Trivy) by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ---------- SIGN: keyless signature of the digest (only if scan passed) ----------
  sign:
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write                        # OIDC for keyless signing
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
