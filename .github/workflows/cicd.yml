name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: tasks-api

jobs:
  # ---------- CI: tests + code/deps scans. No cloud keys. ----------
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasks_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Apply DB schema
        run: psql "$DATABASE_URL" -f schema.sql
        env:
          DATABASE_URL: postgresql://test:testpassword@localhost:5432/tasks_test
      - name: Run tests
        run: pnpm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: testpassword
          PGDATABASE: tasks_test
          JWT_SECRET: test-secret

  # ---------- BUILD + PUSH to ECR (by digest, via OIDC). Only from main. ----------
  build:
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # OIDC
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-push
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900    # 15-minute credentials: shorter window if stolen
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU 
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

  # ---------- SCAN: read-only job, pulls by digest and scans. ----------
  scan:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # OIDC (read-only role)
    steps:
      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-read
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900    # 15-minute credentials: shorter window if stolen
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Image scan (Trivy) by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.registry }}/${{ env.ECR_REPO }}@${{ needs.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
        env:
          TRIVY_PLATFORM: linux/arm64

  # ---------- SIGN: reusable workflow (sign.yml) signs and attests the digest,
  # with an identity that build and scan cannot obtain. Only if build and scan passed. ----------
  sign:
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/sign.yml
    with:
      image: ${{ needs.build.outputs.registry }}/tasks-api
      digest: ${{ needs.build.outputs.digest }}
      aws-region: us-east-1

  # ---------- DEPLOY: verify the image, then roll it out to ECS (only after a human approval). ----------
  # Off until the ECS stack exists: set the repository variable DEPLOY_ENABLED=true to turn it on.
  deploy:
    needs: [build, sign]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: deploy              # required reviewer: waits for an approval before starting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                # OIDC for the AWS deploy role
      attestations: read             # read the provenance from GitHub
    env:
      IMAGE: ${{ needs.build.outputs.registry }}/tasks-api@${{ needs.build.outputs.digest }}
    steps:
      # Actions pinned to exact commits (the tag they had when pinned, in the comment)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecs-deploy
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # 1. Provenance: built by this repo, from main, and attested by sign.yml
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            -R Adavid114/tasks-api \
            --signer-workflow Adavid114/tasks-api/.github/workflows/sign.yml \
            --source-ref refs/heads/main

      # 2. Signature: signed by sign.yml on main (keyless, GitHub OIDC issuer)
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify signature
        run: |
          cosign verify "${IMAGE}" \
            --certificate-identity "https://github.com/Adavid114/tasks-api/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > /dev/null

      # 3. Start from the latest revision of the family (Terraform owns its configuration)...
      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition --task-definition tasks-api \
            --query taskDefinition > task-definition.json

      # ...and change ONLY the image, to the verified digest
      - name: Set the verified image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1
        with:
          task-definition: task-definition.json
          container-name: tasks-api
          image: ${{ env.IMAGE }}

      # 4. Register the new revision, point the service to it, wait until it is stable
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: lab
          service: tasks-api
          wait-for-service-stability: true
