name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: tasks-api

jobs:
  # ---------- CI: tests + code/deps scans. No cloud keys. ----------
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasks_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tasks_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Apply DB schema
        run: psql "$DATABASE_URL" -f schema.sql
        env:
          DATABASE_URL: postgresql://test:testpassword@localhost:5432/tasks_test
      - name: Run tests
        run: pnpm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test
          PGPASSWORD: testpassword
          PGDATABASE: tasks_test
          JWT_SECRET: test-secret

  # ---------- BUILD + PUSH to ECR (by digest, via OIDC). Only from main. ----------
  build:
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # OIDC
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

  # ---------- SCAN: read-only job, pulls by digest and scans. ----------
  scan:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # OIDC (read-only role)
    steps:
      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-read
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Image scan (Trivy) by digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.registry }}/${{ env.ECR_REPO }}@${{ needs.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ---------- SIGN: keyless signature of the digest (only if build and scan passed). ----------
  sign:
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    environment: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # OIDC (for both AWS role AND cosign keyless)
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes ${{ needs.build.outputs.registry }}/${{ env.ECR_REPO }}@${{ needs.build.outputs.digest }}
