# Reusable signing workflow. Signatures and attestations made here carry THIS file's
# identity (job_workflow_ref), which the build and scan jobs cannot obtain even though
# they also have id-token: write for AWS. Verification must require this identity.
name: Sign

on:
  workflow_call:
    inputs:
      image:
        description: "Image name without tag (<registry>/<repository>)"
        type: string
        required: true
      digest:
        description: "Image digest (sha256:...)"
        type: string
        required: true
      aws-region:
        type: string
        required: true

jobs:
  sign:
    environment: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC: AWS role and Sigstore keyless signing
      attestations: write   # record the build provenance attestation
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627118586529:role/github-ecr-push
          aws-region: ${{ inputs.aws-region }}
          role-duration-seconds: 900

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${{ inputs.image }}@${{ inputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
