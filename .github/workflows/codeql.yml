name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'   # también un escaneo programado, lunes 3:30am

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # para publicar los hallazgos en la pestaña Security
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
