global:
  scrape_interval: 15s              # scrapea cada 15 segundos

scrape_configs:
  - job_name: 'node-exporter'       # un "job" = un grupo de objetivos a scrapear
    static_configs:
      - targets: ['node-exporter:9100']   # a quién scrapear (por hostname de la red Docker)

  - job_name: 'cadvisor'                    # nuevo
    static_configs:
      - targets: ['cadvisor:8080']          # cAdvisor expone en 8080 por defecto

  - job_name: 'tasks-api'                 # nuevo
    static_configs:
      - targets: ['api:3000']             # el hostname del servicio api, puerto 3000
